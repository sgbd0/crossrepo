<title>CrossRepo - a crossword of its own code</title>
<style>

  * { box-sizing: border-box; }
  body { font: 15px/1.5 system-ui, -apple-system, sans-serif; margin: 2rem; }
  h1 { font-size: 1.4rem; margin: 0 0 .2rem; }
  .meta { color: #888; margin-bottom: 1.2rem; }
  .wrap { display: flex; flex-wrap: wrap; gap: 2.5rem; align-items: flex-start; }
  #grid { display: grid; gap: 2px; }
  .block { width: 2rem; height: 2rem; }
  .cellwrap { position: relative; width: 2rem; height: 2rem; }
  .cellwrap input {
    width: 100%; height: 100%; text-align: center; padding: 0;
    text-transform: uppercase; font: 600 1rem ui-monospace, monospace;
    border: 1px solid #999; border-radius: 4px;
    background: transparent; color: inherit;
  }
  .cellwrap .num { position: absolute; top: -1px; left: 2px; font-size: .55rem; color: #888; pointer-events: none; }
  .cellwrap input.ok { background: #c9f2c7; border-color: #3f9d42; }
  .cellwrap input.bad { background: #f8cfcf; border-color: #d9534f; }
  .cellwrap input.hl { outline: 2px solid #6ea8fe; }
  h2 { font-size: 1.05rem; margin: 0 0 .4rem; }
  ol { margin: 0 0 1.2rem; padding-left: 1.4rem; }
  li { cursor: pointer; margin: .15rem 0; }
  li:hover { color: #2b6cb0; }
  button { margin-right: .5rem; padding: .4rem .9rem; font: inherit; cursor: pointer; }
  #status { margin-top: .8rem; font-weight: 600; min-height: 1.4rem; }
  footer { margin-top: 2rem; color: #888; font-size: .85rem; }

</head>
<body>

<div class="meta">seed 7 &middot; 28 words &middot; generated by CrossRepo</div>

  <div id="grid"></div>
  <div>
    <h2>Across</h2><ol id="across"></ol>
    <h2>Down</h2><ol id="down"></ol>
    <div>
      <button id="check">Check answers</button>
      <button id="reveal">Reveal solution</button>
    </div>
    <div id="status"></div>

const grid = document.getElementById("grid");
grid.style.gridTemplateColumns = "repeat(" + DATA.cols + ", 2rem)";
const inputs = {};
for (let r = 0; r < DATA.rows; r++) {
  for (let c = 0; c < DATA.cols; c++) {
    const key = r + "," + c;
    const letter = DATA.cells[key];
    const wrap = document.createElement("div");
    if (!letter) {
      wrap.className = "block";
    } else {
      wrap.className = "cellwrap";
      const input = document.createElement("input");
      input.maxLength = 1;
      input.dataset.answer = letter;
      input.addEventListener("input", function () {
        input.value = input.value.toUpperCase();
        const all = Array.prototype.slice.call(grid.querySelectorAll("input"));
        const next = all[all.indexOf(input) + 1];
        if (next) next.focus();
      });
      inputs[key] = input;
      wrap.appendChild(input);
    }
    grid.appendChild(wrap);
  }
}
const starts = {};
for (const w of DATA.words) {
  const key = w.row + "," + w.col;
  if (!(key in starts) || w.number < starts[key]) starts[key] = w.number;
}
for (const key in starts) {
  const input = inputs[key];
  if (!input) continue;
  const num = document.createElement("span");
  num.className = "num";
  num.textContent = starts[key];
  input.parentElement.appendChild(num);
}
function highlight(w, on) {
  for (let k = 0; k < w.word.length; k++) {
    const key = w.dir === "across" ? w.row + "," + (w.col + k) : (w.row + k) + "," + w.col;
    const input = inputs[key];
    if (input) input.classList.toggle("hl", on);
  }
}
for (const pair of [["across", "across"], ["down", "down"]]) {
  const listId = pair[0], dir = pair[1];
  const ol = document.getElementById(listId);
  const words = DATA.words.filter(function (w) { return w.dir === dir; });
  words.sort(function (a, b) { return a.number - b.number; });
  for (const w of words) {
    const li = document.createElement("li");
    li.textContent = w.clue + " [" + w.word.length + "]";
    li.addEventListener("mouseenter", function () { highlight(w, true); });
    li.addEventListener("mouseleave", function () { highlight(w, false); });
    ol.appendChild(li);
  }
}
document.getElementById("check").addEventListener("click", function () {
  let ok = 0, filled = 0;
  const total = Object.keys(inputs).length;
  for (const key in inputs) {
    const input = inputs[key];
    if (input.value === "") { input.classList.remove("ok", "bad"); continue; }
    filled++;
    const good = input.value.toUpperCase() === input.dataset.answer;
    input.classList.toggle("ok", good);
    input.classList.toggle("bad", !good);
    if (good) ok++;
  }
  document.getElementById("status").textContent =
    ok + " / " + total + " correct (" + (total - filled) + " empty)";
});
document.getElementById("reveal").addEventListener("click", function () {
  for (const key in inputs) {
    const input = inputs[key];
    input.value = input.dataset.answer;
    input.classList.add("ok");
    input.classList.remove("bad");
  }
  document.getElementById("status").textContent = "Solution revealed.";
});
